services:
  plof:
    image: ghcr.io/matthiaslubbertsen/api:latest
    # To build locally instead of pulling from GHCR, comment out `image:` above and uncomment:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    env_file: .env
    environment:
      PORT: "3000" # container port; change the host side with HOST_PORT
    ports:
      - "${HOST_PORT:-3000}:3000"
    volumes:
      # Bind mount: data lives in ./storage next to this file.
      # The folder must be writable by UID 1000:  mkdir -p storage && sudo chown 1000:1000 storage
      - ./storage:/app/storage
    restart: unless-stopped
