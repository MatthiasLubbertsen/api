<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plof</title>
<style>
  :root { color-scheme: light dark; --bg:#fff; --fg:#111; --muted:#666; --card:#f3f3f3; --accent:#2563eb; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111; --fg:#eee; --muted:#999; --card:#1d1d1d; --accent:#60a5fa; } }
  body { margin:0; padding:16px; font:16px/1.5 system-ui,sans-serif; background:var(--bg); color:var(--fg); }
  main { max-width:640px; margin:0 auto; }
  h2 { margin-top:28px; font-size:18px; }
  a { color:var(--accent); }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin:8px 0; }
  input, button { font:inherit; padding:8px 10px; border-radius:8px; border:1px solid var(--muted); background:var(--card); color:var(--fg); }
  input { flex:1; min-width:0; }
  pre { background:var(--card); padding:12px; border-radius:8px; overflow-x:auto; white-space:pre-wrap; word-break:break-word; font-size:13px; min-height:1em; }
  p.muted { color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Plof</h1>
  <p class="muted">Demo page for the example APIs. Each API has its own env vars, database, KV and files.</p>

  <h2>hello</h2>
  <div class="row"><input id="name" placeholder="your name" value="Matthias"><button onclick="call('/hello?name='+encodeURIComponent(name.value),'out-hello')">GET /hello</button></div>
  <div class="row"><button onclick="call('/hello/env','out-hello')">GET /hello/env</button></div>
  <pre id="out-hello"></pre>

  <h2>notes</h2>
  <div class="row"><input id="note" placeholder="write a note"><button onclick="call('/notes','out-notes',{method:'POST',body:JSON.stringify({text:note.value})}).then(()=>{note.value='';})">POST</button></div>
  <div class="row"><button onclick="call('/notes','out-notes')">GET /notes</button></div>
  <pre id="out-notes"></pre>

  <h2>weather</h2>
  <div class="row"><input id="city" placeholder="city" value="Amsterdam"><input id="temp" placeholder="°C" value="9" inputmode="decimal" style="max-width:70px"></div>
  <div class="row"><input id="key" placeholder="x-api-key" value="demo-key"><button onclick="call('/weather/reports','out-weather',{method:'POST',headers:{'x-api-key':key.value},body:JSON.stringify({city:city.value,tempC:Number(temp.value)})})">POST report</button></div>
  <div class="row"><button onclick="call('/weather/reports','out-weather')">GET /weather/reports</button><span class="muted">(cached 10s)</span></div>
  <pre id="out-weather"></pre>
</main>
<script>
async function call(url, out, init = {}) {
  const el = document.getElementById(out);
  el.textContent = "...";
  try {
    const res = await fetch(url, { ...init, headers: { "content-type": "application/json", ...(init.headers || {}) } });
    const text = await res.text();
    let body = text;
    try { body = JSON.stringify(JSON.parse(text), null, 2); } catch {}
    el.textContent = `${init.method || "GET"} ${url} -> ${res.status}\n${body}`;
  } catch (e) { el.textContent = String(e); }
}
</script>
</body>
</html>
